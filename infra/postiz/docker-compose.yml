# ClipFarm - Infrastructure Postiz (Auto-hébergé, séparé)
# Pour démarrer : docker compose -f infra/postiz/docker-compose.yml up -d
# Interface web Postiz : http://localhost:4200
#
# Remarque : Postiz utilise le port 5433 pour Postgres afin de ne pas entrer en conflit
# avec le Postgres de ClipFarm sur le port 5432.

services:
  postiz-postgres:
    image: postgres:17-alpine
    container_name: clipfarm-postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: postiz_secure_password
      POSTGRES_DB: postiz
    ports:
      - "5433:5432"
    volumes:
      - postiz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz"]
      interval: 5s
      retries: 10

  postiz-redis:
    image: redis:7-alpine
    container_name: clipfarm-postiz-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - postiz_redisdata:/data

  postiz-app:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: clipfarm-postiz-app
    restart: unless-stopped
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_started
    ports:
      - "4200:5000"
    environment:
      MAIN_URL: "http://localhost:4200"
      FRONTEND_URL: "http://localhost:4200"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:4200/api"
      DATABASE_URL: "postgresql://postiz:postiz_secure_password@postiz-postgres:5432/postiz"
      REDIS_URL: "redis://postiz-redis:6379"
      JWT_SECRET: "clipfarm_postiz_jwt_secret_dev_32chars_long_key"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      IS_GENERAL: "true"
    volumes:
      - postiz_uploads:/uploads

volumes:
  postiz_pgdata:
  postiz_redisdata:
  postiz_uploads:
