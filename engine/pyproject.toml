[project]
name = "clipfarm-engine"
version = "0.1.0"
description = "Moteur ClipFarm : video longue -> clips verticaux sous-titres"
requires-python = ">=3.11,<3.13"
dependencies = []  # le coeur (ffmpeg, sous-titres, signaux, selection) n'a besoin que de la stdlib

[project.optional-dependencies]
# IA locale sur GPU NVIDIA
ai = [
  # torch en dependance directe pour que uv prenne la version CUDA (index pytorch-cu128 plus bas)
  "torch>=2.7",
  "torchaudio>=2.7",
  "whisperx>=3.4",
  "faster-whisper>=1.1",
  "demucs>=4.0",
  "yt-dlp>=2025.1.1",
]
# Phase 2 : API + file de jobs
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2",
  "procrastinate>=2.15",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
]
# Phase 4 : mises en page intelligentes
vision = [
  "mediapipe>=0.10,<1.0.0",
  "opencv-python-headless>=4.10",
  "rapidocr-onnxruntime>=1.3",
]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.uv]
# torch en version CUDA 12.8 pour Windows / Linux avec GPU NVIDIA
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = ["gpu: tests qui utilisent les vrais modeles IA (GPU, Ollama)"]

[tool.ruff]
line-length = 140
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipfarm_engine"]
