[project]
name = "clipfarm-api"
version = "0.1.0"
description = "API FastAPI + procrastinate pour ClipFarm"
requires-python = ">=3.11,<3.13"
dependencies = [
    "clipfarm-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "procrastinate>=2.15",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "pytest-asyncio>=0.23"]

[tool.uv.sources]
clipfarm-engine = { workspace = true }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipfarm_api"]
